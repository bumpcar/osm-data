name: Build data packages

on:
  schedule:
    - cron: "0 2 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
      shared: ${{ steps.read.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          python3 -c "import json;print('list='+json.dumps(list(json.load(open('regions.json')))))" >> "$GITHUB_OUTPUT"
          python3 -c "import json,collections;c=collections.Counter(r['path'] for r in json.load(open('regions.json')).values());print('shared='+json.dumps([p for p,n in c.items() if n>1]))" >> "$GITHUB_OUTPUT"

  extracts:
    needs: regions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJSON(needs.regions.outputs.shared) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r build/requirements.txt
      - id: name
        run: echo "name=$(basename '${{ matrix.path }}')" >> "$GITHUB_OUTPUT"
      - run: |
          mkdir -p work
          cd build
          python -c "from pathlib import Path;from build import download,GEOFABRIK;download(GEOFABRIK+'${{ matrix.path }}',Path('../work/${{ steps.name.outputs.name }}'))"
      - uses: actions/cache/save@v4
        with:
          path: work/${{ steps.name.outputs.name }}
          key: extract-${{ steps.name.outputs.name }}-${{ github.run_id }}

  build:
    needs: [regions, extracts]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r build/requirements.txt
      - run: python -m unittest test_build
        working-directory: build
      - id: extract
        run: python3 -c "import json,os;print('name='+os.path.basename(json.load(open('regions.json'))['${{ matrix.region }}']['path']))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: work/${{ steps.extract.outputs.name }}
          key: extract-${{ steps.extract.outputs.name }}-${{ github.run_id }}
      - run: python build/build.py "${{ matrix.region }}" --out out --work work
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.region }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    needs: [regions, build]
    if: ${{ !cancelled() && needs.regions.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r build/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          path: release/
          merge-multiple: true
      - name: Keep last month's files for failed regions
        run: python build/carry_over.py release
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: python build/sign.py release --previous previous-index.json
      - name: Verify
        run: python build/verify.py release
      - name: Publish
        run: |
          tag="data-$(date -u +%Y-%m-%d)-r${GITHUB_RUN_NUMBER}"
          data_date="$(python3 -c "import json;print(json.load(open('release/index.json'))['data_date'][:10])")"
          cp LICENSE-ODbL.txt README.md release/
          for attempt in 1 2 3; do
            if gh release create "$tag" --latest --title "$data_date" \
                --notes "© OpenStreetMap contributors, ODbL 1.0" \
                release/*.zst release/index.json release/index.json.sig release/LICENSE-ODbL.txt release/README.md; then
              python build/verify.py "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag" > /dev/null && exit 0
            fi
            echo "attempt $attempt failed"
            gh release delete "$tag" --yes --cleanup-tag || true
            sleep 120
          done
          exit 1
      - name: Copy to R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 sync release/ "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" --delete \
            --exclude "index.json" --exclude "index.json.sig" --exclude "*.report.json" --exclude "build-status.json"
          aws s3 cp release/index.json "s3://$R2_BUCKET/index.json" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release/index.json.sig "s3://$R2_BUCKET/index.json.sig" --endpoint-url "$R2_ENDPOINT"
      - name: Count downloads
        continue-on-error: true
        run: python build/bandwidth.py "$GITHUB_REPOSITORY" status/bandwidth.json
      - name: Keep the last three releases
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
      - name: Record the build
        run: |
          cp release/build-status.json status/last-build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/
          git commit -m "Update status"
          git pull --rebase
          git push
      - name: Report regions with old files
        run: |
          if [ -f carried-over.txt ]; then
            echo "::error::Old files kept for: $(cat carried-over.txt). Rerun those regions."
            exit 1
          fi
